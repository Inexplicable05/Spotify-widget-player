<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Player UI</title>
    <style>
        /* =========================================
           PREVIEW ENVIRONMENT STYLES
           (Remove or replace when deploying in PyWebView)
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            background: #111111;
            color: #ffffff;
        }

        /* =========================================
           CORE WIDGET STYLES
           ========================================= */
        
        /* The main capsule container */
        .capsule {
            display: flex;
            align-items: center;
            /* Frosted glass effect - Dark mode */
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            /* Rectangular with rounded edges (12px) */
            border-radius: 12px;
            padding: 6px 20px 6px 6px;
            gap: 14px;
            /* Subtle bright border for depth on dark background */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            
            /* Allows dragging the frameless window */
            user-select: none;
            -webkit-app-region: drag; 
        }

        /* Ensure interactive elements don't trigger window dragging */
        .capsule button, 
        .capsule input, 
        .capsule img {
            -webkit-app-region: no-drag;
        }

        /* Album Art Styling */
        .album-art {
            width: 52px;
            height: 52px;
            /* Mathematically matched inner border-radius (12px outer - 6px padding = 6px) */
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Text Container */
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 140px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF; 
            margin-bottom: -2px;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }

        .artist {
            font-size: 16px;
            font-weight: 600;
            color: #B3B3B3; /* Standard Spotify Light Gray */
            white-space: nowrap;
        }

        /* Media Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 4px;
        }

        /* Semantic Button Styling */
        button.media-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, opacity 0.2s;
            opacity: 0.7; /* Slightly dimmed by default */
            outline: none;
        }
        
        button.media-btn:hover {
            transform: scale(1.1);
            opacity: 1; /* Full brightness on hover */
        }
        
        button.media-btn:active {
            transform: scale(0.95);
        }

        button.media-btn svg {
            fill: #FFFFFF; /* Crisp white buttons */
            width: 28px;
            height: 28px;
            pointer-events: none; /* Ensures the button registers the click, not the SVG path */
        }
        
        button.media-btn.play-btn svg {
            width: 36px;
            height: 36px;
        }

        /* Progress Bar Container */
        .progress-container {
            display: flex;
            align-items: center;
            width: 120px;
            margin-left: 8px;
        }

        /* Semantic Input Range Slider Styling */
        input[type=range].progress-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type=range].progress-slider:focus {
            outline: none;
        }

        /* The Track */
        input[type=range].progress-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            border: none;
            /* The fill is handled via JavaScript background style */
            background: rgba(255, 255, 255, 0.15); 
        }

        /* The Thumb */
        input[type=range].progress-slider::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #FFFFFF; /* Clean white thumb */
            border: none;
            -webkit-appearance: none;
            margin-top: -4px; /* Centers the thumb on the 6px track */
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        
        input[type=range].progress-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <!-- =========================================
         START OF PLAYER WIDGET
         ========================================= -->
    <div class="capsule" id="player-capsule" aria-live="polite">
        <div class="album-art" aria-hidden="true"></div>

        <div class="track-info">
            <div class="title" id="ui-title">To be built</div>
            <div class="artist" id="ui-artist">No media data available yet</div>
        </div>

        <div class="controls" aria-hidden="true">
            <button class="media-btn" id="btn-prev" aria-label="Previous Track" disabled>
                <svg viewBox="0 0 24 24">
                    <path d="M19,6L11,12L19,18V6M11,6L3,12L11,18V6Z" />
                </svg>
            </button>

            <button class="media-btn play-btn" id="btn-playpause" aria-label="Play or Pause" disabled>
                <svg viewBox="0 0 24 24" id="icon-playpause">
                    <path d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                </svg>
            </button>

            <button class="media-btn" id="btn-next" aria-label="Next Track" disabled>
                <svg viewBox="0 0 24 24">
                    <path d="M5,6L13,12L5,18V6M13,6L21,12L13,18V6Z" />
                </svg>
            </button>
        </div>

        <div class="progress-container">
            <input type="range" class="progress-slider" id="ui-progress" min="0" max="100" value="0" aria-label="Seek track" disabled>
        </div>
    </div>
    <!-- =========================================
         END OF PLAYER WIDGET
         ========================================= -->

    <!-- UI Logic for rendering (Agent should bind Python API calls here) -->
    <script>
        const progressBar = document.getElementById('ui-progress');
        const playPauseBtn = document.getElementById('btn-playpause');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const playPauseIcon = document.getElementById('icon-playpause').querySelector('path');
        
        // UI Constants
        window.themeColor = '#1DB954';
        const trackColor = 'rgba(255, 255, 255, 0.15)';

        // 1. Dynamic Progress Bar Fill
        function updateProgressFill() {
            const value = progressBar.value;
            progressBar.style.background = `linear-gradient(to right, ${window.themeColor} 0%, ${window.themeColor} ${value}%, ${trackColor} ${value}%, ${trackColor} 100%)`;
        }

        // Initialize progress bar
        updateProgressFill();
        progressBar.addEventListener('input', updateProgressFill);

        // 2. Button Event Listeners
        prevBtn.addEventListener('click', () => {
            console.log("Action: Previous");
            if (window.pywebview) window.pywebview.api.media_command('prev');
        });

        nextBtn.addEventListener('click', () => {
            console.log("Action: Next");
            if (window.pywebview) window.pywebview.api.media_command('next');
        });

        playPauseBtn.addEventListener('click', () => {
            console.log("Action: Play/Pause");
            if (window.pywebview) window.pywebview.api.media_command('playpause');
            
            // Visual mock toggle
            const isPlaying = playPauseIcon.getAttribute('d') === 'M8,5.14V19.14L19,12.14L8,5.14Z';
            if (isPlaying) {
                playPauseIcon.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); // Pause
            } else {
                playPauseIcon.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); // Play
            }
        });

        // 3. Backend Update Function (To be called by Python)
        window.updateUI = function(title, artist, color, progressVal) {
            document.getElementById('ui-title').innerText = title;
            document.getElementById('ui-artist').innerText = artist;
            
            if (color) window.themeColor = color;
            if (progressVal !== undefined) progressBar.value = progressVal;
            
            updateProgressFill();
        };

        window.updateUI('To be built', 'No media data available yet', null, 0);
    </script>
</body>
</html>
