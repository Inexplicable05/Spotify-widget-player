<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SpotiFloat Animation Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .album {
      width: 200px;
      height: 200px;
      margin: 20px;
      background-image: url('https://picsum.photos/200');
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .controls button {
      margin: 5px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #444;
      color: #fff;
    }
    .controls button:hover { background: #666; }
    /* Animation definitions */
    @keyframes fadeAnim {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    
    .fade { animation: fadeAnim 0.8s forwards; }
    
    /* NEW crazy animations */
    
    
    
    
  </style>
</head>
<body>
  <h1>SpotiFloat – Animation Test</h1>
  <div class="album" id="album"></div>
  <div class="controls">
    <button onclick="trigger('fade')">Fade In</button>

  </div>
  <script>
    const album = document.getElementById('album');
    function clear() {
      // Remove any animation class before adding a new one (only fade exists now)
      album.classList.remove('fade');
    }
    function trigger(name) {
      clear();
      // Force reflow to restart animation
      void album.offsetWidth;
      album.classList.add(name);
    }
    // Initialise dynamic title colour based on album cover
    applyCoverPalette();

    // Dynamic Title Colour feature: set H1 colour based on dominant album cover colour
    function applyCoverPalette() {
      const img = new Image();
      img.crossOrigin = "Anonymous";
      const bg = getComputedStyle(album).backgroundImage;
      const url = bg.slice(5, -2); // strip url("...")
      img.src = url;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        let r = 0, g = 0, b = 0, count = 0;
        // sample every 5th pixel to reduce work
        for (let i = 0; i < data.length; i += 4 * 5) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }
        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);
        const title = document.querySelector('h1');
        title.style.color = `rgb(${r},${g},${b})`;
      };
    }
    applyCoverPalette();
  </script>
</body>
</html>
