<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Player</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #111111;
            --panel: rgba(20, 20, 20, 0.72);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --muted: #b3b3b3;
            --accent: #1db954;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: transparent;
            color: var(--text);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        html {
            background: transparent;
        }

        .capsule {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            min-width: 520px;
        }

        .album-art {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 0.75rem;
            text-align: center;
            padding: 6px;
            flex: 0 0 auto;
            object-fit: cover;
        }

        .album-art.is-image {
            padding: 0;
            background: none;
        }

        .track-info {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .title {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist,
        .status {
            font-size: 0.9rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            max-width: 240px;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            border: 0;
            border-radius: 999px;
            width: 40px;
            height: 40px;
            display: inline-grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .progress-container {
            width: 132px;
            flex: 0 0 132px;
        }

        input[type="range"] {
            width: 100%;
            margin: 0;
        }

        @media (max-width: 640px) {
            .capsule {
                min-width: 0;
                width: calc(100vw - 24px);
                flex-wrap: wrap;
                justify-content: center;
            }

            .track-info {
                min-width: 0;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="capsule" id="player-capsule" aria-live="polite">
        <img class="album-art" id="ui-album-art" alt="Album art unavailable" aria-hidden="true" />

        <div class="track-info">
            <div class="title" id="ui-title">To be built</div>
            <div class="artist" id="ui-artist">No media data available yet</div>
            <div class="status" id="ui-status">Media bridge is to be built.</div>
        </div>

        <div class="controls" aria-label="Media controls">
            <button type="button" id="btn-prev" aria-label="Previous track">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19,6L11,12L19,18V6M11,6L3,12L11,18V6Z"></path></svg>
            </button>
            <button type="button" id="btn-playpause" aria-label="Play or pause">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"></path></svg>
            </button>
            <button type="button" id="btn-next" aria-label="Next track">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5,6L13,12L5,18V6M13,6L21,12L13,18V6Z"></path></svg>
            </button>
        </div>

        <div class="progress-container">
            <input type="range" id="ui-progress" min="0" max="100" step="0.1" value="0" aria-label="Track progress" disabled>
        </div>
    </main>

    <script src="contract.js"></script>
    <script src="app.js"></script>
</body>
</html>
